# Bouwt bij elke push een (niet-ondertekende) LoopApp.ipa.
# SideStore ondertekent hem daarna met je eigen Apple ID.
# De app gebruikt LoopCore, dus ook wijzigingen daar maken een nieuwe ipa.
# Enkel tekstbestanden of de LoopCore-testworkflow wijzigen maakt geen nieuwe ipa.
name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/core.yml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installeren
        run: brew install xcodegen

      - name: Xcode-project genereren
        run: xcodegen generate

      - name: App bouwen
        run: |
          xcodebuild \
            -project LoopApp.xcodeproj \
            -scheme LoopApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::error::Build mislukt, fouten hieronder"
              grep -E "error:" build.log | head -n 60
              tail -n 40 build.log
              exit 1
            }
          tail -n 5 build.log

      - name: IPA maken
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LoopApp.app Payload/
          zip -qry LoopApp.ipa Payload
          ls -lh LoopApp.ipa

      - name: Uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopApp-ipa
          path: LoopApp.ipa

      - name: Publiceren als release (makkelijk downloaden op je iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LoopApp build ${{ github.run_number }}
          files: LoopApp.ipa
          make_latest: true
