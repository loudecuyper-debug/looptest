# XcodeGen-config: GitHub Actions maakt hiermee het Xcode-project aan.
name: LoopApp
options:
  bundleIdPrefix: com.loudecuyper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
packages:
  LoopCore:
    path: LoopCore
targets:
  LoopApp:
    type: application
    platform: iOS
    sources:
      - path: LoopApp
        excludes:
          - Info.plist
    dependencies:
      - package: LoopCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loudecuyper.loopapp
        PRODUCT_NAME: LoopApp
        INFOPLIST_FILE: LoopApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
