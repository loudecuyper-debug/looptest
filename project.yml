# XcodeGen-config: GitHub Actions maakt hiermee het Xcode-project aan.
name: LoopTest
options:
  bundleIdPrefix: com.loudecuyper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LoopTest:
    type: application
    platform: iOS
    sources:
      - path: LoopTest
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loudecuyper.looptest
        PRODUCT_NAME: LoopTest
        INFOPLIST_FILE: LoopTest/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
