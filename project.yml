# XcodeGen-config: GitHub Actions maakt hiermee het Xcode-project aan.
name: LoopApp
options:
  bundleIdPrefix: com.loudecuyper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "10"
packages:
  LoopCore:
    path: LoopCore
targets:
  LoopApp:
    type: application
    platform: iOS
    sources:
      - path: LoopApp
        excludes:
          - Info.plist
    dependencies:
      - package: LoopCore
      - target: RunnerWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loudecuyper.loopapp
        PRODUCT_NAME: LoopApp
        INFOPLIST_FILE: LoopApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
  RunnerWidgets:
    # Widget-extensie: Live Activity tijdens het lopen en de widget "training van vandaag".
    # De widget leest de gegevens uit de App Group die iloader bij het installeren aanmaakt.
    type: app-extension
    platform: iOS
    sources:
      - path: RunnerWidgets
        excludes:
          - Info.plist
      - path: LoopApp/LiveActivity
      - path: LoopApp/WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loudecuyper.loopapp.widgets
        PRODUCT_NAME: RunnerWidgets
        INFOPLIST_FILE: RunnerWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
